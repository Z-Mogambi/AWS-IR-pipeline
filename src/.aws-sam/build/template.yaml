AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: "incident-response-pipeline                                         \
  \                                                  SAM template for a serverless\
  \ incident response pipeline for GuardDuty findings.                           \
  \         \n                                                                   \
  \                                                 \n"
Globals:
  Function:
    Timeout: 30
    MemorySize: 128
    Runtime: python3.9
    Architectures:
    - x86_64
Resources:
  AlertsSNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Incident Response Alerts
  RouterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: RouterFunction
      Handler: app.handler
      Policies:
      - StepFunctionsExecutionPolicy:
          StateMachineName:
            Fn::GetAtt:
            - IncidentResponseStateMachine
            - Name
      Environment:
        Variables:
          SFN_STATE_MACHINE_ARN:
            Ref: IncidentResponseStateMachine
    Metadata:
      SamResourceId: RouterFunction
  EnrichFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: EnrichFunction
      Handler: app.handler
      Policies:
      - AmazonEC2ReadOnlyAccess
    Metadata:
      SamResourceId: EnrichFunction
  IsolateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: IsolateFunction
      Handler: app.handler
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - ec2:DescribeInstances
          - ec2:DescribeSecurityGroups
          - ec2:CreateSecurityGroup
          - ec2:ModifyInstanceAttribute
          Resource: '*'
    Metadata:
      SamResourceId: IsolateFunction
  AlertFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: AlertFunction
      Handler: app.handler
      Policies:
      - SNSPublishMessagePolicy:
          TopicName:
            Fn::GetAtt:
            - AlertsSNSTopic
            - TopicName
      Environment:
        Variables:
          SNS_TOPIC_ARN:
            Ref: AlertsSNSTopic
    Metadata:
      SamResourceId: AlertFunction
  IncidentResponseStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Definition:
        Comment: Orchestrates incident response for GuardDuty findings on EC2 instances
        StartAt: EnrichFinding
        States:
          EnrichFinding:
            Type: Task
            Resource:
              Fn::GetAtt:
              - EnrichFunction
              - Arn
            Next: IsProductionCheck
            Catch:
            - ErrorEquals:
              - States.ALL
              Next: FailState
          IsProductionCheck:
            Type: Choice
            Choices:
            - Variable: $.IsProduction
              BooleanEquals: true
              Next: IsolateAndAlert
            Default: NonProdAlert
          IsolateAndAlert:
            Type: Parallel
            Branches:
            - StartAt: IsolateInstance
              States:
                IsolateInstance:
                  Type: Task
                  Resource:
                    Fn::GetAtt:
                    - IsolateFunction
                    - Arn
                  End: true
            - StartAt: SendAlert
              States:
                SendAlert:
                  Type: Task
                  Resource:
                    Fn::GetAtt:
                    - AlertFunction
                    - Arn
                  End: true
            Next: SuccessState
          NonProdAlert:
            Type: Task
            Resource:
              Fn::GetAtt:
              - AlertFunction
              - Arn
            Next: SuccessState
          SuccessState:
            Type: Succeed
          FailState:
            Type: Fail
      Policies:
      - LambdaInvokePolicy:
          FunctionName:
            Ref: EnrichFunction
      - LambdaInvokePolicy:
          FunctionName:
            Ref: IsolateFunction
      - LambdaInvokePolicy:
          FunctionName:
            Ref: AlertFunction
  GuardDutyFindingRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Rule to capture GuardDuty EC2 findings and trigger the router
      EventPattern:
        source:
        - aws.guardduty
        detail-type:
        - GuardDuty Finding
        detail:
          resource:
            resourceType:
            - Instance
      Targets:
      - Arn:
          Fn::GetAtt:
          - RouterFunction
          - Arn
        Id: RouterFunctionTarget
  InvokeRouterPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Fn::GetAtt:
        - RouterFunction
        - Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn:
        Fn::GetAtt:
        - GuardDutyFindingRule
        - Arn
Outputs:
  StateMachineArn:
    Description: ARN of the Incident Response State Machine
    Value:
      Ref: IncidentResponseStateMachine
  AlertsSNSTopicArn:
    Description: ARN of the SNS topic for alerts
    Value:
      Ref: AlertsSNSTopic
