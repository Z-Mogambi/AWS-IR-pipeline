AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  incident-response-pipeline
  Serverless incident response for GuardDuty findings: verify, decide against a
  versioned response policy, then notify or contain, recording every action
  write-ahead so it can be released later.

Parameters:
  AccountEnvironmentMap:
    Type: String
    Default: ""
    Description: >
      Optional "accountId=environment" list, comma separated, for example
      "111122223333=non-production,444455556666=production". Valid environments
      are production and non-production. This overrides the Environment tag,
      because an account is much harder for an attacker to change than a tag.

  ProtectedRoleNames:
    Type: String
    Default: ""
    Description: >
      Comma separated IAM role names the pipeline must never modify - your
      break-glass and administrator roles. The pipeline's own roles and all
      service-linked roles are protected automatically.

  AlertEmailEndpoint:
    Type: String
    Default: ""
    Description: >
      Optional email address to subscribe to the alerts topic. Leave empty to
      manage subscriptions yourself. Without a subscriber, alerts go nowhere.

  EvidenceRetentionDays:
    Type: Number
    Default: 30
    MinValue: 1
    Description: >
      Object Lock default retention, in days, on the evidence bucket. Governance
      mode: an object cannot be deleted or overwritten for this long without the
      s3:BypassGovernanceRetention permission, which nothing in this stack has.

  EnableNaclBackstop:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Add stateless NACL deny entries for the remote addresses named in the
      finding, as a second line behind the security group work. Off by default:
      NACLs are subnet-wide, so this affects every instance in the subnet.

  EnableMemoryCapture:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Run the SSM memory-capture hook before isolation. Off by default and not
      yet implemented - see the note in src/evidence/lambda_function.py.

  DnsFirewallRuleGroupPriority:
    Type: Number
    Default: 101
    Description: >
      Priority for associating the DNS Firewall block rule group with a VPC.
      Must not collide with an existing association in the same VPC.

  VerifyWrittenPolicies:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Read back every inline policy this pipeline writes and refuse it unless it
      is a pure Deny. Leave on: it is the check that catches an Allow reaching a
      role via the one function holding iam:PutRolePolicy.

  ApprovalTimeoutSeconds:
    Type: Number
    Default: 3600
    MinValue: 60
    Description: >
      How long an approval request waits before the timeout action applies.

  ApprovalTimeoutAction:
    Type: String
    Default: Escalate
    AllowedValues: [Escalate, Contain]
    Description: >
      What to do when nobody answers. Escalate re-notifies and stops without
      changing anything, which is the production default - nobody answering is
      not consent. Contain proceeds, and should only be used where an
      unattended containment is genuinely safer than waiting.

  MaxAutoContainInstances:
    Type: Number
    Default: 3
    MinValue: 1
    Description: >
      How many instances one finding may contain automatically. Attack sequences
      name a group of resources that share an Auto Scaling group, instance
      profile, launch template, CloudFormation stack, AMI or VPC - so above this
      many, the finding goes to approval instead. Containing three compromised
      instances is incident response; containing thirty because they share an
      AMI is an outage.

  ContainmentConcurrency:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 10
    Description: >
      How many instances are contained in parallel. Kept small because every
      iteration makes several EC2 and IAM calls, and the account-wide rate
      limits are shared with everything else running.

  BedrockModelId:
    Type: String
    Default: ""
    Description: >
      Bedrock model id or inference profile id for AI triage. Leave empty to
      disable triage entirely. The prompt is built in the Anthropic Messages
      format, so this must be a Claude model - and newer Claude models on
      Bedrock are only reachable through a cross-Region inference profile id,
      not a bare model id. There is deliberately no default: a wrong model id
      should fail loudly at deploy time, not silently pick something.

  TriageMaxTokens:
    Type: Number
    Default: 1024
    MinValue: 256
    MaxValue: 4096
    Description: Upper bound on triage output length.

  TriageTemperature:
    Type: String
    Default: "0"
    Description: >
      Sampling temperature for triage. Kept at 0 so the same finding produces
      the same summary, which matters when the output is read as evidence.

  EnableGuardDutyInvestigation:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Call the GuardDuty Investigation preview API for attack sequences. Off by
      default. Requires the AI_ANALYST detector feature, the delegated
      administrator account, and one of the ten supported Regions; the quota is
      10 investigations per account per day and 100 in total.

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmailEndpoint, ""]]
  HasAiTriage: !Not [!Equals [!Ref BedrockModelId, ""]]

Globals:
  Function:
    Timeout: 30
    MemorySize: 128
    Runtime: python3.14
    Architectures:
      - x86_64
    Handler: lambda_function.handler
    Layers:
      - !Ref CommonLayer
    Environment:
      Variables:
        INCIDENTS_TABLE: !Ref IncidentsTable
        ACCOUNT_ENVIRONMENT_MAP: !Ref AccountEnvironmentMap
        PROTECTED_ROLE_NAMES: !Ref ProtectedRoleNames
        # SAM names every function role "<stack>-<Function>Role-<suffix>", so this
        # prefix lets irlib.guard recognise the pipeline's own roles.
        PIPELINE_ROLE_PREFIX: !Sub "${AWS::StackName}-"

Resources:
  # ------------------------------------------------------------------ shared

  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${AWS::StackName}-irlib"
      Description: Shared incident response helpers and the versioned response policy.
      ContentUri: layers/common/
      CompatibleRuntimes:
        - python3.14
      RetentionPolicy: Delete

  AlertsSNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Incident Response Alerts

  AlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertsSNSTopic
      Protocol: email
      Endpoint: !Ref AlertEmailEndpoint

  EvidenceBucket:
    Type: AWS::S3::Bucket
    # Evidence outlives the stack. Object Lock cannot be turned on after
    # creation, so it is set here rather than left to a later change.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration:
        Status: Enabled
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: GOVERNANCE
            Days: !Ref EvidenceRetentionDays
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  EvidenceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref EvidenceBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt EvidenceBucket.Arn
              - !Sub "${EvidenceBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  # Security groups do not filter DNS traffic to the Route 53 Resolver, so a
  # DNS-tunnelled channel survives network isolation entirely. This is the only
  # control that closes it. Note it is VPC-wide, not instance-scoped.
  QuarantineDomainList:
    Type: AWS::Route53Resolver::FirewallDomainList
    Properties:
      Name: !Sub "${AWS::StackName}-quarantine-domains"
      # The resource requires at least one domain. This is an RFC 2606 reserved
      # name that can never resolve; real domains are added per incident.
      Domains:
        - quarantine-placeholder.invalid

  QuarantineDnsRuleGroup:
    Type: AWS::Route53Resolver::FirewallRuleGroup
    Properties:
      Name: !Sub "${AWS::StackName}-quarantine"
      FirewallRules:
        - FirewallDomainListId: !GetAtt QuarantineDomainList.Id
          Priority: 1
          Action: BLOCK
          BlockResponse: NXDOMAIN

  # Applied to the untrusted block before the model sees it. The Step Functions
  # Bedrock integration has no documented guardrail field, so it is applied with
  # ApplyGuardrail in the enrichment function instead.
  TriageGuardrail:
    Type: AWS::Bedrock::Guardrail
    Condition: HasAiTriage
    Properties:
      Name: !Sub "${AWS::StackName}-triage"
      Description: Prompt-attack filter for attacker-influenced finding content.
      BlockedInputMessaging: Blocked by the incident response guardrail.
      BlockedOutputsMessaging: Blocked by the incident response guardrail.
      ContentPolicyConfig:
        FiltersConfig:
          - Type: PROMPT_ATTACK
            InputStrength: HIGH
            # Prompt-attack filtering only applies to input; the output strength
            # must be NONE for this filter type.
            OutputStrength: NONE

  IncidentsTable:
    Type: AWS::DynamoDB::Table
    # The ledger is the only record of what was changed and how to change it
    # back. Losing it with the stack would strand every contained instance.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: IncidentId
          AttributeType: S
        - AttributeName: RecordId
          AttributeType: S
      KeySchema:
        - AttributeName: IncidentId
          KeyType: HASH
        - AttributeName: RecordId
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # --------------------------------------------------------------- functions
  # One role per function, created by SAM from the Policies block below. Each
  # holds only what that function calls. EC2 Describe actions do not support
  # resource-level permissions, so those statements use "*" by necessity;
  # every mutating action is scoped to a resource ARN.

  RouterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/router/
      Policies:
        # The only role in the stack allowed to start an execution.
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt IncidentResponseStateMachine.Name
      Environment:
        Variables:
          SFN_STATE_MACHINE_ARN: !Ref IncidentResponseStateMachine

  VerifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/verify/
      Policies:
        - Statement:
            - Effect: Allow
              Action: guardduty:GetFindings
              Resource: !Sub "arn:${AWS::Partition}:guardduty:${AWS::Region}:${AWS::AccountId}:detector/*"
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
              Resource: !GetAtt IncidentsTable.Arn

  EnrichFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/enrich/
      Policies:
        - Statement:
            - Effect: Allow
              # ec2:DescribeInstances does not support resource-level
              # permissions; "*" is the narrowest this action can be written.
              Action: ec2:DescribeInstances
              Resource: "*"

  DecideFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/decide/
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt IncidentsTable.Arn
      Environment:
        Variables:
          APPROVAL_TIMEOUT_SECONDS: !Ref ApprovalTimeoutSeconds
          APPROVAL_TIMEOUT_ACTION: !Ref ApprovalTimeoutAction
          AI_TRIAGE_ENABLED: !If [HasAiTriage, "true", "false"]
          ENABLE_GUARDDUTY_INVESTIGATION: !Ref EnableGuardDutyInvestigation
          MAX_AUTO_CONTAIN_INSTANCES: !Ref MaxAutoContainInstances
          CONTAINMENT_CONCURRENCY: !Ref ContainmentConcurrency

  EvidenceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/evidence/
      Timeout: 300
      MemorySize: 256
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${EvidenceBucket.Arn}/*"
        - Statement:
            - Effect: Allow
              Action:
                - ec2:ModifyInstanceAttribute
                - ec2:CreateSnapshots
              Resource:
                - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*"
                - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:snapshot/*"
                # A snapshot has no owner at the moment it is created, so EC2
                # authorises CreateSnapshots against the ownerless ARN form -
                # with an empty account field. Observed live: the account-scoped
                # ARN above never matches and the call is denied. This does not
                # widen access to other accounts' snapshots, which carry their
                # owner's id.
                - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}::snapshot/*"
            - Effect: Allow
              # Tagging the snapshots CreateSnapshots produces, and labelling
              # the instance so it is obvious in the console. The snapshot is
              # tagged during creation, so the ownerless form is needed here too.
              Action: ec2:CreateTags
              Resource:
                - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:snapshot/*"
                - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}::snapshot/*"
                - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
        - Statement:
            - Effect: Allow
              Action: autoscaling:DetachInstances
              Resource: !Sub "arn:${AWS::Partition}:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*"
        - Statement:
            - Effect: Allow
              # Neither Describe action supports resource-level permissions.
              Action:
                - elasticloadbalancing:DescribeTargetGroups
                - elasticloadbalancing:DescribeTargetHealth
              Resource: "*"
            - Effect: Allow
              Action: elasticloadbalancing:DeregisterTargets
              Resource: !Sub "arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:targetgroup/*"
        - Statement:
            - Effect: Allow
              # Best effort. Requires Malware Protection to be enabled on the
              # detector beforehand - the service-linked role is deliberately
              # not created here, so this function needs no IAM write access.
              # Takes the EC2 instance ARN as its ResourceArn, so it authorises
              # against the instance rather than the detector. Observed live:
              # the detector-scoped ARN alone was denied.
              Action: guardduty:StartMalwareScan
              Resource:
                - !Sub "arn:${AWS::Partition}:guardduty:${AWS::Region}:${AWS::AccountId}:detector/*"
                - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt IncidentsTable.Arn
      Environment:
        Variables:
          EVIDENCE_BUCKET: !Ref EvidenceBucket
          ENABLE_MEMORY_CAPTURE: !Ref EnableMemoryCapture

  NetIsolateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/netisolate/
      Timeout: 180
      Policies:
        - Statement:
            - Effect: Allow
              # EC2 Describe actions cannot be scoped to a resource.
              Action:
                - ec2:DescribeSecurityGroups
                - ec2:DescribeNetworkInterfaces
                - ec2:DescribeNetworkAcls
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action: ec2:CreateSecurityGroup
              Resource:
                - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*"
                - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc/*"
            - Effect: Allow
              Action: ec2:CreateTags
              Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*"
              Condition:
                StringEquals:
                  "ec2:CreateAction": CreateSecurityGroup
            - Effect: Allow
              Action:
                - ec2:AuthorizeSecurityGroupIngress
                - ec2:AuthorizeSecurityGroupEgress
                - ec2:RevokeSecurityGroupIngress
                - ec2:RevokeSecurityGroupEgress
              Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*"
            - Effect: Allow
              Action: ec2:ModifyNetworkInterfaceAttribute
              Resource:
                - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*"
                - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*"
            - Effect: Allow
              Action: ec2:CreateNetworkAclEntry
              Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-acl/*"
        - Statement:
            - Effect: Allow
              Action: route53resolver:UpdateFirewallDomains
              Resource: !Sub "arn:${AWS::Partition}:route53resolver:${AWS::Region}:${AWS::AccountId}:firewall-domain-list/*"
            - Effect: Allow
              Action: route53resolver:AssociateFirewallRuleGroup
              Resource: !Sub "arn:${AWS::Partition}:route53resolver:${AWS::Region}:${AWS::AccountId}:firewall-rule-group/*"
            - Effect: Allow
              # A list operation with no resource in its authorisation context.
              # Observed live: the rule-group-scoped ARN was denied.
              Action: route53resolver:ListFirewallRuleGroupAssociations
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt IncidentsTable.Arn
      Environment:
        Variables:
          ENABLE_NACL_BACKSTOP: !Ref EnableNaclBackstop
          DNS_FIREWALL_DOMAIN_LIST_ID: !GetAtt QuarantineDomainList.Id
          DNS_FIREWALL_RULE_GROUP_ID: !GetAtt QuarantineDnsRuleGroup.Id
          DNS_FIREWALL_PRIORITY: !Ref DnsFirewallRuleGroupPriority

  CredContainFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/credcontain/
      Timeout: 60
      # The only function in the stack with iam:PutRolePolicy. Nothing else may
      # invoke it - only the state machine's role is granted lambda:InvokeFunction
      # on it, and no resource policy widens that.
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - iam:PutRolePolicy
                - iam:GetRolePolicy
              Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/*"
            - Effect: Deny
              # Defence in depth behind irlib.guard: even if the code check were
              # bypassed, IAM refuses to let the pipeline rewrite its own roles
              # or any service-linked role.
              Action:
                - iam:PutRolePolicy
                - iam:DeleteRolePolicy
              Resource:
                - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AWS::StackName}-*"
                - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/*"
            - Effect: Allow
              Action: iam:GetInstanceProfile
              Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/*"
        - Statement:
            - Effect: Allow
              # Re-derives the instance profile itself rather than trusting the
              # enrichment state it was handed.
              Action: ec2:DescribeInstances
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt IncidentsTable.Arn
      Environment:
        Variables:
          VERIFY_WRITTEN_POLICIES: !Ref VerifyWrittenPolicies

  IdentityFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/identity/
      Timeout: 60
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - iam:UpdateAccessKey
                - iam:ListAccessKeys
              Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:user/*"
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt IncidentsTable.Arn

  ImdsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/imds/
      Timeout: 60
      Policies:
        - Statement:
            - Effect: Allow
              Action: ec2:ModifyInstanceMetadataOptions
              Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt IncidentsTable.Arn

  ReleaseFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/release/
      Timeout: 300
      Policies:
        - Statement:
            - Effect: Allow
              # Reverses the network work. No CreateSecurityGroup: release only
              # ever deletes the per-incident group it is given.
              Action:
                - ec2:ModifyNetworkInterfaceAttribute
                - ec2:DeleteSecurityGroup
              Resource:
                - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*"
                - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*"
            - Effect: Allow
              Action:
                - ec2:ModifyInstanceAttribute
                - ec2:ModifyInstanceMetadataOptions
              Resource:
                - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*"
            - Effect: Allow
              Action: ec2:DeleteNetworkAclEntry
              Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-acl/*"
        - Statement:
            - Effect: Allow
              # Removes the Deny that credential containment wrote. Note this is
              # DeleteRolePolicy, not PutRolePolicy - release can take a policy
              # away but cannot write one.
              Action: iam:DeleteRolePolicy
              Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/*"
            - Effect: Deny
              Action: iam:DeleteRolePolicy
              Resource:
                - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AWS::StackName}-*"
                - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/*"
            - Effect: Allow
              Action: iam:UpdateAccessKey
              Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:user/*"
        - Statement:
            - Effect: Allow
              Action: route53resolver:UpdateFirewallDomains
              Resource: !Sub "arn:${AWS::Partition}:route53resolver:${AWS::Region}:${AWS::AccountId}:firewall-domain-list/*"
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:Query
              Resource: !GetAtt IncidentsTable.Arn

  AiEnrichFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/aienrich/
      Timeout: 120
      MemorySize: 256
      Policies:
        - Statement:
            - Effect: Allow
              # Read-only. Blast radius is a question about what the role can
              # do, never a reason to change it.
              Action:
                - iam:GetInstanceProfile
                - iam:ListAttachedRolePolicies
                - iam:ListRolePolicies
                - iam:GetRolePolicy
              Resource:
                - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/*"
                - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/*"
        - Statement:
            - Effect: Allow
              # Neither action supports resource-level permissions.
              Action:
                - cloudtrail:LookupEvents
                - inspector2:ListFindings
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action: bedrock:ApplyGuardrail
              Resource: !If
                - HasAiTriage
                - !GetAtt TriageGuardrail.GuardrailArn
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/*"
      Environment:
        Variables:
          GUARDRAIL_ID: !If [HasAiTriage, !GetAtt TriageGuardrail.GuardrailId, ""]
          GUARDRAIL_VERSION: !If [HasAiTriage, !GetAtt TriageGuardrail.Version, "DRAFT"]
          TRIAGE_MAX_TOKENS: !Ref TriageMaxTokens
          TRIAGE_TEMPERATURE: !Ref TriageTemperature

  TriageValidateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/triagevalidate/
      Timeout: 30
      # No policies at all: it only parses and validates a string.

  InvestigateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/investigate/
      Timeout: 60
      Policies:
        - Statement:
            - Effect: Allow
              # The preview API is absent from the runtime's bundled boto3, so
              # the request is signed directly - but the IAM action is the same.
              Action:
                - guardduty:CreateInvestigation
                - guardduty:GetInvestigation
              Resource: !Sub "arn:${AWS::Partition}:guardduty:${AWS::Region}:${AWS::AccountId}:detector/*"
      Environment:
        Variables:
          ENABLE_GUARDDUTY_INVESTIGATION: !Ref EnableGuardDutyInvestigation

  AlertFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/alert/
      Policies:
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AlertsSNSTopic.TopicName
        - Statement:
            - Effect: Allow
              # Reads the write-ahead ledger so a partial-failure alert reports
              # what actually completed rather than what was intended, and
              # records the measured time-to-contain on the incident.
              Action:
                - dynamodb:Query
                - dynamodb:UpdateItem
              Resource: !GetAtt IncidentsTable.Arn
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref AlertsSNSTopic

  # ----------------------------------------------------------- orchestration

  IncidentResponseStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      DefinitionUri: statemachine/incident-response.asl.json
      DefinitionSubstitutions:
        VerifyFunctionArn: !GetAtt VerifyFunction.Arn
        EnrichFunctionArn: !GetAtt EnrichFunction.Arn
        DecideFunctionArn: !GetAtt DecideFunction.Arn
        EvidenceFunctionArn: !GetAtt EvidenceFunction.Arn
        NetIsolateFunctionArn: !GetAtt NetIsolateFunction.Arn
        CredContainFunctionArn: !GetAtt CredContainFunction.Arn
        IdentityFunctionArn: !GetAtt IdentityFunction.Arn
        ImdsFunctionArn: !GetAtt ImdsFunction.Arn
        AiEnrichFunctionArn: !GetAtt AiEnrichFunction.Arn
        TriageValidateFunctionArn: !GetAtt TriageValidateFunction.Arn
        # Step Functions validates the definition at CreateStateMachine, and the
        # optimised Bedrock integration rejects an empty ModelId - so an empty
        # parameter would fail the whole stack even though the Triage state is
        # never reached when triage is off. A placeholder keeps the definition
        # valid without inventing a real model id.
        BedrockModelId: !If
          - HasAiTriage
          - !Ref BedrockModelId
          - ai-triage-disabled
        InvestigateFunctionArn: !GetAtt InvestigateFunction.Arn
        AlertFunctionArn: !GetAtt AlertFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref VerifyFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref EnrichFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref DecideFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref EvidenceFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref NetIsolateFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref CredContainFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref IdentityFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref ImdsFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref AiEnrichFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref TriageValidateFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref InvestigateFunction
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              # Covers both a bare foundation model id and an inference profile.
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/*"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
        - LambdaInvokePolicy:
            FunctionName: !Ref AlertFunction

  # ------------------------------------------------------------------ events

  GuardDutyInstanceFindingRule:
    Type: AWS::Events::Rule
    Properties:
      Description: GuardDuty findings against EC2 instances.
      EventPattern:
        source:
          - aws.guardduty
        detail-type:
          - GuardDuty Finding
        detail:
          resource:
            resourceType:
              - Instance
      Targets:
        - Arn: !GetAtt RouterFunction.Arn
          Id: RouterFunctionTarget

  ReleaseStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      DefinitionUri: statemachine/release.asl.json
      DefinitionSubstitutions:
        ReleaseFunctionArn: !GetAtt ReleaseFunction.Arn
        AlertFunctionArn: !GetAtt AlertFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref ReleaseFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref AlertFunction

  # Credential exfiltration and AI Protection findings carry resourceType
  # AccessKey, not Instance, so they never match the rule above.
  GuardDutyAccessKeyFindingRule:
    Type: AWS::Events::Rule
    Properties:
      Description: GuardDuty findings against access keys and role sessions.
      EventPattern:
        source:
          - aws.guardduty
        detail-type:
          - GuardDuty Finding
        detail:
          resource:
            resourceType:
              - AccessKey
      Targets:
        - Arn: !GetAtt RouterFunction.Arn
          Id: RouterFunctionAccessKeyTarget

  InvokeRouterFromAccessKeyRulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt RouterFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt GuardDutyAccessKeyFindingRule.Arn

  # Attack sequence findings carry no top-level resourceType that the two rules
  # above would match; their affected resources live under
  # service.detection.sequence.resources instead. They are matched on the type
  # prefix, so the three rules stay non-overlapping.
  GuardDutyAttackSequenceRule:
    Type: AWS::Events::Rule
    Properties:
      Description: GuardDuty Extended Threat Detection attack sequences.
      EventPattern:
        source:
          - aws.guardduty
        detail-type:
          - GuardDuty Finding
        detail:
          type:
            - prefix: "AttackSequence:"
      Targets:
        - Arn: !GetAtt RouterFunction.Arn
          Id: RouterFunctionAttackSequenceTarget

  InvokeRouterFromAttackSequenceRulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt RouterFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt GuardDutyAttackSequenceRule.Arn

  InvokeRouterPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt RouterFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt GuardDutyInstanceFindingRule.Arn

  IrPipelineDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${AWS::StackName}-incident-response"
      DashboardBody: !Sub |
          {
            "widgets": [
              {
                "type": "text",
                "x": 0,
                "y": 0,
                "width": 24,
                "height": 3,
                "properties": {
                  "markdown": "# Incident response pipeline\n\nBoth timings are measured from the GuardDuty finding's own `createdAt`, so they include GuardDuty's detection and delivery latency as well as this pipeline's. That is usually the larger part and is not something the pipeline controls - but it is the number that reflects how long an attacker actually had.\n\n`TimeToContainSeconds` is taken from the incident ledger's last completed containment action, not from when the email was sent."
                }
              },
              {
                "type": "metric",
                "x": 0,
                "y": 3,
                "width": 12,
                "height": 6,
                "properties": {
                  "title": "Time to contain, by environment",
                  "view": "timeSeries",
                  "stacked": false,
                  "region": "${AWS::Region}",
                  "metrics": [
                    [
                      "IRPipeline",
                      "TimeToContainSeconds",
                      "Environment",
                      "production",
                      {
                        "stat": "p50",
                        "label": "prod p50"
                      }
                    ],
                    [
                      "...",
                      {
                        "stat": "p90",
                        "label": "prod p90"
                      }
                    ],
                    [
                      "IRPipeline",
                      "TimeToContainSeconds",
                      "Environment",
                      "non-production",
                      {
                        "stat": "p50",
                        "label": "non-prod p50"
                      }
                    ]
                  ],
                  "yAxis": {
                    "left": {
                      "label": "Seconds",
                      "showUnits": false,
                      "min": 0
                    }
                  }
                }
              },
              {
                "type": "metric",
                "x": 12,
                "y": 3,
                "width": 12,
                "height": 6,
                "properties": {
                  "title": "Time to notify, by environment",
                  "view": "timeSeries",
                  "stacked": false,
                  "region": "${AWS::Region}",
                  "metrics": [
                    [
                      "IRPipeline",
                      "TimeToNotifySeconds",
                      "Environment",
                      "production",
                      {
                        "stat": "p50",
                        "label": "prod p50"
                      }
                    ],
                    [
                      "...",
                      {
                        "stat": "p90",
                        "label": "prod p90"
                      }
                    ],
                    [
                      "IRPipeline",
                      "TimeToNotifySeconds",
                      "Environment",
                      "non-production",
                      {
                        "stat": "p50",
                        "label": "non-prod p50"
                      }
                    ]
                  ],
                  "yAxis": {
                    "left": {
                      "label": "Seconds",
                      "showUnits": false,
                      "min": 0
                    }
                  }
                }
              },
              {
                "type": "metric",
                "x": 0,
                "y": 9,
                "width": 12,
                "height": 6,
                "properties": {
                  "title": "State machine executions",
                  "view": "timeSeries",
                  "stacked": false,
                  "region": "${AWS::Region}",
                  "metrics": [
                    [
                      "AWS/States",
                      "ExecutionsStarted",
                      "StateMachineArn",
                      "${IncidentResponseStateMachine}",
                      {
                        "stat": "Sum"
                      }
                    ],
                    [
                      "AWS/States",
                      "ExecutionsSucceeded",
                      "StateMachineArn",
                      "${IncidentResponseStateMachine}",
                      {
                        "stat": "Sum"
                      }
                    ],
                    [
                      "AWS/States",
                      "ExecutionsFailed",
                      "StateMachineArn",
                      "${IncidentResponseStateMachine}",
                      {
                        "stat": "Sum"
                      }
                    ],
                    [
                      "AWS/States",
                      "ExecutionsTimedOut",
                      "StateMachineArn",
                      "${IncidentResponseStateMachine}",
                      {
                        "stat": "Sum"
                      }
                    ]
                  ]
                }
              },
              {
                "type": "metric",
                "x": 12,
                "y": 9,
                "width": 12,
                "height": 6,
                "properties": {
                  "title": "Containment function errors",
                  "view": "timeSeries",
                  "stacked": false,
                  "region": "${AWS::Region}",
                  "metrics": [
                    [
                      "AWS/Lambda",
                      "Errors",
                      "FunctionName",
                      "${EvidenceFunction}",
                      {
                        "stat": "Sum",
                        "label": "evidence"
                      }
                    ],
                    [
                      "AWS/Lambda",
                      "Errors",
                      "FunctionName",
                      "${NetIsolateFunction}",
                      {
                        "stat": "Sum",
                        "label": "network"
                      }
                    ],
                    [
                      "AWS/Lambda",
                      "Errors",
                      "FunctionName",
                      "${CredContainFunction}",
                      {
                        "stat": "Sum",
                        "label": "credentials"
                      }
                    ],
                    [
                      "AWS/Lambda",
                      "Errors",
                      "FunctionName",
                      "${ImdsFunction}",
                      {
                        "stat": "Sum",
                        "label": "imds"
                      }
                    ]
                  ]
                }
              }
            ]
          }

Outputs:
  StateMachineArn:
    Description: ARN of the incident response state machine.
    Value: !Ref IncidentResponseStateMachine
  AlertsSNSTopicArn:
    Description: ARN of the alerts topic. Subscribe to it or alerts go nowhere.
    Value: !Ref AlertsSNSTopic
  IncidentsTableName:
    Description: DynamoDB table holding the write-ahead incident ledger.
    Value: !Ref IncidentsTable
  EvidenceBucketName:
    Description: Object Lock protected bucket holding findings and instance state.
    Value: !Ref EvidenceBucket
  ReleaseStateMachineArn:
    Description: >
      Release machine. Start it with
      aws stepfunctions start-execution --state-machine-arn <this>
      --input '{"incidentId":"<id>"}'
    Value: !Ref ReleaseStateMachine
  QuarantineDnsRuleGroupId:
    Description: DNS Firewall rule group that blocks domains seen in findings.
    Value: !GetAtt QuarantineDnsRuleGroup.Id
