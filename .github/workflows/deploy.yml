# Deploy to AWS from main, or on demand.
#
# Authentication is by GitHub OIDC: the workflow exchanges a short-lived OIDC
# token for AWS credentials. There are no long-lived access keys in this repo's
# secrets, so there is nothing here to leak. The role's trust policy is pinned
# to this repository and this branch - see infra/github-oidc-role.yaml.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "deploy" to confirm
        required: true
        default: ''
  push:
    branches: [main]

permissions:
  # Required to request the OIDC token. Everything else stays read-only.
  id-token: write
  contents: read

concurrency:
  # Never two deployments of the same stack at once.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: sam deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Add required reviewers to this environment in the repository settings to
    # put a human in front of every deployment. The OIDC role's trust policy
    # restricts which ref may assume it; the environment restricts who may run it.
    environment: production

    # A manual run must be confirmed; a push to main deploys directly.
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.confirm == 'deploy'

    steps:
      - name: Check out the code
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'

      - name: Install development dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes \
            -r requirements-dev.txt

      - name: Run the test suite
        # The same gate as CI. A deployment never skips it.
        run: python -m pytest -q

      - name: Set up SAM CLI
        # aws-actions/setup-sam v3
        uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310
        with:
          use-installer: true

      - name: Configure AWS credentials
        # aws-actions/configure-aws-credentials v6.3.0
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          # Set this repository variable to the role created by
          # infra/github-oidc-role.yaml. A role ARN is not a secret.
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: ir-pipeline-deploy-${{ github.run_id }}
          # Short-lived by default; no reason to extend it.
          role-duration-seconds: 1800

      - name: Build
        run: sam build

      - name: Deploy
        # Parameter overrides come from a repository variable so model ids,
        # protected role names and the alert address are not baked into the repo.
        # Example:
        #   BedrockModelId=... ProtectedRoleNames=BreakGlassAdmin AlertEmailEndpoint=...
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --role-arn "${{ vars.AWS_CLOUDFORMATION_ROLE_ARN }}" \
            ${{ vars.SAM_PARAMETER_OVERRIDES && format('--parameter-overrides {0}', vars.SAM_PARAMETER_OVERRIDES) || '' }}
